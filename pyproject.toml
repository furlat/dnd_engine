[project]
name = "dnd"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "numpy",
    "pygame-ce==2.5.8",
    "pydantic",
    "requests",
    "rich",
    "scipy",
    "typer",
    "uvicorn",
    "websockets",
]

[dependency-groups]
dev = [
    "pillow",
    "pytest",
    "pyright",
]

[tool.pyright]
include = ["ai", "dnd", "game", "server"]
exclude = ["**/__pycache__", ".venv", "game_logs", "to_archive", "game/assets", ".runtime", "output"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true
reportUndefinedVariable = true

[tool.pytest.ini_options]
addopts = ["--capture=no"]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
