[project]
name = "dnd"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "pydantic",
    "requests",
    "rich",
    "typer",
    "uvicorn",
    "websockets",
]

[dependency-groups]
dev = [
    "pytest",
    "pyright",
]

[tool.pyright]
include = ["dnd", "examples", "server", "cli"]
exclude = ["**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true
reportUndefinedVariable = true

[tool.pytest.ini_options]
addopts = ["--capture=no"]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
